name: Feature request
description: Propose a change to the standard, the CLI, or the template
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve, and for whom?
    validations:
      required: true
  - type: textarea
    id: users
    attributes:
      label: Intended users
      description: Who benefits, and what do they need to succeed?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: |
        What should change? Major design decisions require an ADR or
        spec.md text before implementation (docs/decisions/).
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Objective, checkable conditions for calling this done.
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      description: What this change explicitly does not do.
    validations:
      required: true
  - type: textarea
    id: spec-impact
    attributes:
      label: Specification impact
      description: |
        New or changed spec.md requirement IDs, or "none" with the
        reason. Example: adds FR-031.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks and validation needs
      description: What could go wrong, and what must be tested before merge.
    validations:
      required: true
