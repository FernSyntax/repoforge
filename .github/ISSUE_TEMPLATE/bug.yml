name: Bug report
description: Report incorrect behaviour in RepoForge or the standard
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Never include tokens or credentials. If tool output leaked a
        token, do not file an issue — follow SECURITY.md instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should have happened, and why that is correct.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands and input. Include a redacted policy file if relevant.
      render: sh
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "safety: the tool mutated or deleted something it must not"
        - "security: a credential, permission, or protection boundary is involved"
        - "correctness: wrong result, no data loss"
        - "usability: confusing output or message"
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Affected requirements
      description: |
        spec.md requirement IDs this bug violates (for example FR-003,
        NFR-002), or "unknown".
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: repoforge version
      placeholder: "output of: repoforge version"
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, Go version (if building from source), relevant configuration.
      render: text
    validations:
      required: false
