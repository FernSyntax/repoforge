name: Task
description: Scoped maintenance or engineering work
labels: ["task"]
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: The single outcome this task delivers.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Bounded scope
      description: What is in scope — and what is explicitly out of scope.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Issues, pull requests, or releases this depends on, or "none".
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How we know the task is done (checks, tests, docs).
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Authorising context
      description: Links to issues, ADRs, or spec.md sections that authorise this work.
    validations:
      required: true
