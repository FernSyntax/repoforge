# Production release, orchestrated end to end.
#
# The three things that must all be true before anything is published are
# expressed as jobs with `needs:`, so a pushed `v*` tag can no longer
# publish binaries merely because it exists:
#
#   validate ──> release ──> (Template Publication picks up from here)
#
# 1. `validate` proves the tag is strict SemVer, annotated, present in
#    CHANGELOG.md, and that the tagged commit passes the repository's own
#    checks. A failure here stops the pipeline before any artifact exists.
# 2. `release` builds the binaries, stages a DRAFT release, uploads only
#    missing assets, attests build provenance, verifies everything, and
#    publishes last. A failure anywhere before the final step leaves a
#    resumable draft, never a partial public release; a retry resumes it
#    when the tag still targets the same commit, and fails closed
#    otherwise. A tag that already has a public release is never touched.
#
# Template Publication is a separate workflow triggered by
# `workflow_run` on this workflow's successful completion, so the App
# private key never enters a workflow that also builds code, and the
# template gate cannot fire unless the release itself succeeded.
#
# Nothing here runs on branches or pull requests. The only writes are the
# release and its attestations.

name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Resolve the tag
        id: tag
        run: |
          {
            echo "tag=${GITHUB_REF_NAME}"
          } >> "$GITHUB_OUTPUT"
          echo "releasing ${GITHUB_REF_NAME} at $(git rev-parse HEAD)"

      # Tag strictness, annotation, changelog section, and a
      # version-stamped build — the release policy, before any artifact.
      - name: Validate the release tag
        run: scripts/release-check.sh "${GITHUB_REF_NAME}"

      # The tagged commit must itself be a green tree: the release is
      # built from this source, so a broken tree means a broken release.
      - name: Validate the repository
        run: go run ./cmd/repoforge validate

      - name: Prove the schema pairs
        run: scripts/check-schema-parity

      # The release notes exist and are non-empty. Extracting them here
      # means the release job cannot fail on a missing section after the
      # binaries are already built.
      # The notes are written to RUNNER_TEMP, never into the checkout:
      # GoReleaser refuses to build a dirty tree, so an untracked notes.md
      # in the repository aborts the release with "git is in a dirty
      # state". This is the exact failure the release pipeline hit once.
      - name: Extract the release notes from CHANGELOG.md
        run: |
          ./scripts/release-notes.sh "${GITHUB_REF_NAME}" > "$RUNNER_TEMP/notes.md"
          echo "notes: $(wc -c < "$RUNNER_TEMP/notes.md") bytes"
          head -3 "$RUNNER_TEMP/notes.md"

      - name: Upload the release notes for the release job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes.md
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download the validated release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes

      # GoReleaser shells out to syft for SBOMs; no trusted action
      # exists, so the pinned release binary (SHA-256 from the
      # official checksums.txt) is verified and put on PATH. All
      # scratch files stay in RUNNER_TEMP: anything written to the
      # checkout trips GoReleaser's clean-tree check and fails the
      # release.
      - name: Install syft
        env:
          SYFT_VERSION: "1.54.1"
          SYFT_SHA256: "c069905b391cc4c20a5ba65ad5c10be2a7ba074f8ea6ad203e24d14e303dad47"
        run: |
          curl -sSL -o "${RUNNER_TEMP}/syft.tar.gz" "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  ${RUNNER_TEMP}/syft.tar.gz" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/syft"
          tar -xzf "${RUNNER_TEMP}/syft.tar.gz" -C "${RUNNER_TEMP}/syft" syft
          echo "${RUNNER_TEMP}/syft" >> "${GITHUB_PATH}"

      # Fixed GoReleaser version (never a range): the action verifies
      # the downloaded archive against the published checksums itself.
      # `--release-notes` supplies the CHANGELOG.md section, so the
      # published notes are this repository's own release record rather
      # than a generated summary of commit subjects.
      - name: Build the release without publishing it
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean --skip=publish --release-notes=${{ runner.temp }}/notes/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Release creation is explicit and verified rather than a
      # GoReleaser side effect. Publication goes through a recoverable
      # draft state machine instead of creating a public release first:
      #
      #   resolve state → ensure draft → upload missing assets only →
      #   attest → verify everything → publish last
      #
      # A tag that already has a PUBLIC release is never touched: the
      # release is immutable, so the run fails closed. A DRAFT from the
      # same tag and commit is resumed, never recreated. A retry therefore
      # completes safely, and can never overwrite artifacts, reuse a
      # different source commit, or accept an incomplete release.
      - name: Resolve the release state
        id: relstate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          head_sha=$(git rev-parse HEAD)
          echo "tag ${GITHUB_REF_NAME} at $head_sha"
          # No release at all: a fresh run. Anything below creates state.
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "state=absent" >> "$GITHUB_OUTPUT"
            echo "no release for ${GITHUB_REF_NAME}; a draft will be staged"
            exit 0
          fi
          # A release exists. Published releases are immutable — the run
          # ends here rather than touching it. Only drafts may resume.
          if [ "$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "::error::release ${GITHUB_REF_NAME} is already published; published releases are immutable and a tag is never reused or moved" >&2
            exit 1
          fi
          # A draft resumes only when it belongs to this exact source: the
          # tag must still dereference to the checked-out commit. A draft
          # whose tag moved (or that was made for another commit) is
          # contradictory state, not something to adopt — fail closed and
          # leave it for a human, never delete or rewrite it here.
          draft_sha=$(git rev-parse --verify --quiet "${GITHUB_REF_NAME}^{commit}") || {
            echo "::error::cannot resolve tag ${GITHUB_REF_NAME} to a commit" >&2
            exit 1
          }
          if [ "$draft_sha" != "$head_sha" ]; then
            echo "::error::draft release ${GITHUB_REF_NAME} targets $draft_sha, but this run builds $head_sha; refusing to resume a draft from a different source commit" >&2
            exit 1
          fi
          echo "state=resume" >> "$GITHUB_OUTPUT"
          echo "resuming draft release ${GITHUB_REF_NAME} for $head_sha"

      - name: Ensure the draft release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "draft release ${GITHUB_REF_NAME} already present; resuming without recreating"
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/notes/notes.md" \
            --verify-tag \
            --draft
          echo "staged draft release ${GITHUB_REF_NAME}; nothing is public yet"

      - name: Upload the missing release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Uploads only what is absent. Existing assets are never
          # overwritten, so a retry cannot replace a good file with a bad
          # rebuild — and a draft carrying files from a different source
          # is caught by the exact-set check below instead of being
          # silently adopted.
          set -euo pipefail
          have=$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name')
          for f in dist/checksums.txt dist/*.tar.gz dist/*.zip dist/*.sbom.json; do
            # A missing glob expands to itself when nullglob is off; skip
            # patterns that matched nothing (e.g. no .zip on some matrix).
            [ -e "$f" ] || continue
            name=$(basename "$f")
            if printf '%s\n' "$have" | grep -qxF "$name"; then
              echo "already present: $name (leaving untouched)"
            else
              echo "uploading: $name"
              gh release upload "${GITHUB_REF_NAME}" "$f"
            fi
          done

      # SLSA build provenance over the checksum file: every archive and
      # SBOM becomes an attestation subject by digest. Separate SBOM
      # attestations would add steps without adding coverage.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Verify the staged release completely
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Every check below must pass while the release is still a
          # draft. Publication is a separate, later step — nothing here
          # makes anything public.
          #
          # 1. Exact asset set. The expectation is derived from
          # checksums.txt itself — the file GoReleaser wrote to bind
          # every artifact it produced — plus checksums.txt, so the
          # check needs no hardcoded count and cannot rot when the
          # matrix changes. An unexpected extra file is as wrong as a
          # missing one.
          expected=$(awk '{print $2}' dist/checksums.txt; echo "checksums.txt")
          expected=$(printf '%s\n' "$expected" | sort -u)
          actual=$(gh release view "${GITHUB_REF_NAME}" --json assets --jq -r '.assets[].name' | sort -u)
          if [ "$expected" != "$actual" ]; then
            echo "::error::asset set mismatch on draft ${GITHUB_REF_NAME}" >&2
            echo "--- expected (from dist/checksums.txt) ---" >&2
            echo "$expected" >&2
            echo "--- actual (on the release) ---" >&2
            echo "$actual" >&2
            exit 1
          fi
          echo "asset set matches dist/checksums.txt exactly ($(printf '%s' "$actual" | wc -l) files)"
          #
          # 2. Archive integrity: every file verifies against the
          # published checksum file. checksums.txt lists bare file names,
          # so the check runs from inside dist/.
          (cd dist && sha256sum -c checksums.txt)
          #
          # 3. Every archive has its SBOM sidecar and vice versa.
          for a in dist/*.tar.gz dist/*.zip; do
            [ -e "$a" ] || continue
            if [ ! -e "$a.sbom.json" ]; then
              echo "::error::archive $(basename "$a") has no SBOM sidecar" >&2
              exit 1
            fi
          done
          for s in dist/*.sbom.json; do
            [ -e "$s" ] || continue
            base=${s%.sbom.json}
            if [ ! -e "$base" ]; then
              echo "::error::SBOM $(basename "$s") has no matching archive" >&2
              exit 1
            fi
          done
          echo "every archive has an SBOM sidecar and vice versa"
          #
          # 4. Build-provenance attestation verifies for every archive.
          # A missing or invalid attestation fails here, while the
          # release is still a draft — never after publication.
          for a in dist/*.tar.gz dist/*.zip; do
            [ -e "$a" ] || continue
            gh attestation verify "$a" --repo "$GITHUB_REPOSITORY" >/dev/null
            echo "attestation verifies: $(basename "$a")"
          done
          #
          # 5. The draft still targets this commit and is still a draft.
          # Anything else means something moved underneath the run.
          if [ "$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "::error::release ${GITHUB_REF_NAME} is no longer a draft; refusing to proceed" >&2
            exit 1
          fi
          echo "draft ${GITHUB_REF_NAME} fully verified; ready to publish"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The single, explicit, last mutation: flip the verified draft
          # public. Everything above proved the content; this step only
          # changes visibility.
          set -euo pipefail
          gh release edit "${GITHUB_REF_NAME}" --draft=false
          if [ "$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft)" != "false" ]; then
            echo "::error::release ${GITHUB_REF_NAME} did not publish; isDraft is not false" >&2
            exit 1
          fi
          gh release view "${GITHUB_REF_NAME}" --json tagName,isDraft,assets \
            --jq '{tag: .tagName, draft: .isDraft, assets: (.assets|length)}'
