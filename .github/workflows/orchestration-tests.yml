# Python orchestration gate: pinned, hash-verified dependencies and
# the offline graph suite. The Go suite in tests.yml is the primary
# gate; this job keeps the LangGraph runtime honest in ordinary CI.
#
# Runs on every push to main and every pull request. Read-only:
# top-level permissions are empty, the single job needs only
# repository contents.

name: Orchestration Tests

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: orchestration/requirements.txt

      - name: Install pinned dependencies
        run: pip install --require-hashes -r orchestration/requirements.txt

      - name: Test the graph offline
        run: python -m pytest orchestration/tests -q
