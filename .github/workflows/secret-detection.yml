# Secret detection: fail the run if committed history contains
# secrets. Gitleaks scans the full history (fetch-depth 0), so a leak
# merged in the past fails the present — that is the point.
#
# Read-only: the job needs repository contents and nothing else. It
# reports; it never rewrites history or touches settings. Findings
# follow SECURITY.md coordinated disclosure, never a public log.

name: Secret Detection

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # Required for pull request scans (breaking change in the
          # action); the automatic token carries this job's own
          # read-only permissions, nothing more.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
