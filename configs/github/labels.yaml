# Canonical repository labels, schema v1.
#
# The deterministic label set every RepoForge-managed repository
# carries. Bootstrap creates missing labels and updates the color and
# description of labels with these names; any other label is
# user-owned — preserved, never modified or deleted. Doctor audits the
# canonical names against this document.
#
# Ownership is by exact name (the labels API has no metadata field).
# Colors are hexadecimal without a leading '#'; descriptions follow
# the API limit of 100 characters.
version: "v1"
labels:
  - name: "type:bug"
    color: "d73a4a"
    description: "Something isn't working"
  - name: "type:feature"
    color: "a2eeef"
    description: "New capability or improvement"
  - name: "type:task"
    color: "7057ff"
    description: "Planned unit of work"
  - name: "type:docs"
    color: "0075ca"
    description: "Documentation needs"
  - name: "type:security"
    color: "5319e7"
    description: "Security-relevant work"
  - name: "type:maintenance"
    color: "cfd3d7"
    description: "Routine upkeep and chores"
  - name: "priority:p0"
    color: "d93f0b"
    description: "Critical: drop everything"
  - name: "priority:p1"
    color: "e99695"
    description: "High priority"
  - name: "priority:p2"
    color: "fbca04"
    description: "Normal priority"
  - name: "priority:p3"
    color: "0e8a16"
    description: "Low priority"
  - name: "area:build"
    color: "f9d0c4"
    description: "Build system and packaging"
  - name: "area:ci"
    color: "1d76db"
    description: "Continuous integration"
  - name: "area:docs"
    color: "008672"
    description: "Documentation area"
  - name: "area:github"
    color: "57606a"
    description: "GitHub configuration and automation"
  - name: "area:security"
    color: "0052cc"
    description: "Security area"
  - name: "area:tooling"
    color: "e4e669"
    description: "Developer tooling"
  - name: "status:blocked"
    color: "b60205"
    description: "Cannot proceed until unblocked"
  - name: "status:needs-info"
    color: "d4c5f9"
    description: "Waiting on more information"
  - name: "status:needs-review"
    color: "fef2c0"
    description: "Ready for review"
