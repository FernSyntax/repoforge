# URLs are template variables resolved by bootstrap for each managed
# repository. Do not substitute concrete repository URLs here.
blank_issues_enabled: false
contact_links:
  - name: Security vulnerability
    url: "{{ .RepoURL }}/security/policy"
    about: Report vulnerabilities privately per SECURITY.md. Never file security reports as issues.
  - name: Support
    url: "{{ .RepoURL }}/blob/main/SUPPORT.md"
    about: Where to get help and what to expect.
